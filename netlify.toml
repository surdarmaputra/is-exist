[build]
  # The file-based config wins over UI build settings. build:netlify sets the
  # adapter flag explicitly and fails the build if the SSR function is missing.
  command = "npm run build:netlify"
  publish = "dist/client"

[build.environment]
  NETLIFY_DEPLOYMENT = "1"
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  targetPort = 3200
  port = 8888
